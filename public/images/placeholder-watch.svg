<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#A88B5A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#242321" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#E5DCCE" stroke-width="1.2"/>

  <!-- Watch Strap Top -->
  <path d="M 245 40 L 355 40 L 345 180 L 255 180 Z" fill="#3D3A36" opacity="0.9" filter="url(#shadow)"/>
  <line x1="260" y1="50" x2="260" y2="170" stroke="#A88B5A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="340" y1="50" x2="340" y2="170" stroke="#A88B5A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Watch Strap Bottom -->
  <path d="M 255 420 L 345 420 L 355 560 L 245 560 Z" fill="#3D3A36" opacity="0.9" filter="url(#shadow)"/>
  <line x1="260" y1="430" x2="260" y2="550" stroke="#A88B5A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="340" y1="430" x2="340" y2="550" stroke="#A88B5A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Watch Case Outer & Crown -->
  <rect x="445" y="285" width="20" height="30" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="300" cy="300" r="150" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="300" cy="300" r="140" fill="#242321"/>
  <circle cx="300" cy="300" r="132" fill="#F7F4EC"/>
  <circle cx="300" cy="300" r="128" fill="none" stroke="#E5DCCE" stroke-width="1.5"/>

  <!-- Hour Markers -->
  <g stroke="#242321" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="182" x2="300" y2="198"/>
    <line x1="300" y1="402" x2="300" y2="418"/>
    <line x1="182" y1="300" x2="198" y2="300"/>
    <line x1="402" y1="300" x2="418" y2="300"/>
  </g>
  <g stroke="#A88B5A" stroke-width="2" stroke-linecap="round">
    <line x1="359" y1="198" x2="351" y2="212"/>
    <line x1="402" y1="241" x2="388" y2="249"/>
    <line x1="402" y1="359" x2="388" y2="351"/>
    <line x1="359" y1="402" x2="351" y2="388"/>
    <line x1="241" y1="402" x2="249" y2="388"/>
    <line x1="198" y1="359" x2="212" y2="351"/>
    <line x1="198" y1="241" x2="212" y2="249"/>
    <line x1="241" y1="198" x2="249" y2="212"/>
  </g>

  <!-- Brand Text on Dial -->
  <text x="300" y="248" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="bold" fill="#242321" text-anchor="middle" letter-spacing="2">O'CLOCK</text>
  <text x="300" y="262" font-family="'DM Sans', sans-serif" font-size="8" fill="#777168" text-anchor="middle" letter-spacing="1.5">CURATED TIMEPIECES</text>

  <!-- Watch Hands (10:10 display) -->
  <g filter="url(#shadow)">
    <line x1="300" y1="300" x2="240" y2="240" stroke="#242321" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="300" x2="370" y2="230" stroke="#242321" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="280" y1="320" x2="300" y2="300" stroke="#A88B5A" stroke-width="1.5"/>
    <line x1="300" y1="300" x2="300" y2="195" stroke="#A88B5A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="300" cy="300" r="7" fill="url(#goldGrad)"/>
    <circle cx="300" cy="300" r="3" fill="#242321"/>
  </g>

  <!-- Bottom Capsule Tag -->
  <g transform="translate(300, 560)">
    <rect x="-110" y="-20" width="220" height="24" rx="12" fill="#FFFFFF" stroke="#E5DCCE" stroke-width="1"/>
    <text x="0" y="-4" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="bold" fill="#242321" text-anchor="middle" letter-spacing="1.5">O'CLOCK BOUTIQUE</text>
  </g>
</svg>
